version: '3.8'

services:
  # MongoDB Database
  db:
    image: mongo:6-jammy
    container_name: intelmeet-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - intelmeet-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: intelmeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - intelmeet-net

  # Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelmeet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mongodb://db:27017/intelmeet
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:8080 # Set to your production URL in deploy dashboard
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:3000/api/auth/google/callback
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
    networks:
      - intelmeet-net

  # React Frontend (Nginx static serving)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelmeet-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:3000 # Configured for local Compose run
    depends_on:
      - backend
    networks:
      - intelmeet-net

networks:
  intelmeet-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
